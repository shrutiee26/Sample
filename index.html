<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Control the Ocean</title>
<meta name="description" content="A gesture-controlled underwater game. Use your webcam and your hands to control the ocean.">
<style>
  html,body{margin:0;height:100%;background:#021019;overflow:hidden;font-family:"Trebuchet MS",system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;-webkit-user-select:none;user-select:none;touch-action:none}
  #c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;background:#021019}
  #cam{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
  #intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;
    background:radial-gradient(ellipse at 50% 30%,rgba(20,110,160,.88),rgba(2,16,25,.97));z-index:5}
  #intro h1{margin:0;font-size:clamp(34px,7vw,76px);letter-spacing:.06em;text-shadow:0 0 24px #4fd8ff,0 0 60px #1a8fd0}
  #intro p{margin:0;max-width:640px;font-size:clamp(14px,2vw,19px);color:#cfeeff;line-height:1.5}
  .btn{font:inherit;font-weight:700;font-size:clamp(15px,2.2vw,20px);padding:15px 30px;border-radius:40px;border:2px solid #ffe9a8;color:#fff;cursor:pointer;
    background:linear-gradient(180deg,#1fa5d8,#0c6aa8);box-shadow:0 0 24px rgba(79,216,255,.55);transition:transform .15s}
  .btn:hover{transform:scale(1.05)}
  .btn.alt{background:linear-gradient(180deg,#3b4f66,#202c3c);border-color:#8aa;box-shadow:none;font-size:clamp(13px,1.8vw,16px);padding:11px 24px}
  #status{min-height:22px;color:#ffe9a8;font-size:15px}
  #intro small{color:#8fb6cc}
  #touchbtns{position:absolute;right:14px;bottom:14px;display:none;gap:10px;z-index:4}
  #touchbtns button{font:inherit;font-weight:700;padding:14px 16px;border-radius:14px;border:2px solid #bfe9ff;background:rgba(10,60,100,.75);color:#fff;font-size:14px;touch-action:none}
  #touchbtns button:active,#touchbtns button.on{background:#1fa5d8}
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="cam" playsinline muted></video>

<div id="intro">
  <h1>CONTROL THE OCEAN</h1>
  <p>A gesture-powered underwater adventure. Steer the currents, summon whirlpools, rescue lost fish and keep the sharks and storms at bay &mdash; using only your hands.</p>
  <button class="btn" id="btnCam">&#128247;&nbsp; Play with camera (hand gestures)</button>
  <button class="btn alt" id="btnMouse">&#128433;&nbsp; Play with mouse / touch</button>
  <div id="status"></div>
  <small>Best in Chrome on a laptop or desktop with good lighting. Your camera video never leaves your device.</small>
</div>

<div id="touchbtns">
  <button id="uiWave">WAVE</button><button id="uiWhirl">WHIRL</button><button id="uiCalm">CALM</button>
</div>

<script>
(() => {
'use strict';

// ============================================================ setup
const W = 1280, H = 720;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = W; canvas.height = H;
const video = document.getElementById('cam');
const statusEl = document.getElementById('status');
const intro = document.getElementById('intro');

function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  canvas.style.width = (W * s) + 'px';
  canvas.style.height = (H * s) + 'px';
}
addEventListener('resize', resize); resize();

// ============================================================ helpers
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const angDiff = (a, b) => ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI;
const rgb = (c, a = 1) => a >= 1 ? `rgb(${c[0]|0},${c[1]|0},${c[2]|0})` : `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const shade = (c, f) => [clamp(c[0] * f, 0, 255), clamp(c[1] * f, 0, 255), clamp(c[2] * f, 0, 255)];
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function rr(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function txt(s, x, y, size, color = '#fff', align = 'left', alpha = 1, weight = '700') {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = `${weight} ${size}px "Trebuchet MS",system-ui,sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = 'rgba(8,20,40,.75)'; ctx.fillText(s, x + 2, y + 2);
  ctx.fillStyle = color; ctx.fillText(s, x, y);
  ctx.restore();
}
function panel(x, y, w, h, fill = 'rgba(8,40,70,.62)', border = 'rgba(190,235,255,.55)', r = 16) {
  ctx.save(); rr(ctx, x, y, w, h, r); ctx.fillStyle = fill; ctx.fill();
  if (border) { ctx.strokeStyle = border; ctx.lineWidth = 1.5; ctx.stroke(); }
  ctx.restore();
}
// cached soft glow sprites
const glowCache = {};
function glowSprite(c) {
  const k = c.map(v => v | 0).join(',');
  let s = glowCache[k];
  if (!s) {
    s = mk(128, 128); const g = s.getContext('2d');
    const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, `rgba(${k},1)`); gr.addColorStop(.25, `rgba(${k},.5)`); gr.addColorStop(.6, `rgba(${k},.14)`); gr.addColorStop(1, `rgba(${k},0)`);
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128); glowCache[k] = s;
  }
  return s;
}
function glow(x, y, r, c, a = 1) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = clamp(a, 0, 1);
  ctx.drawImage(glowSprite(c), x - r, y - r, r * 2, r * 2); ctx.restore();
}

// ============================================================ audio (tiny synth)
let actx = null, muted = false;
function tone(f1, f2, dur, type = 'sine', vol = 0.08, delay = 0) {
  if (!actx || muted) return;
  const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  grab() { tone(500, 900, .12, 'sine', .07); },
  deliver() { [660, 830, 990, 1320].forEach((f, i) => tone(f, f * 1.01, .18, 'triangle', .08, i * .07)); },
  pearl() { tone(1200, 1800, .2, 'sine', .07); },
  hurt() { tone(220, 60, .45, 'sawtooth', .1); },
  calm() { tone(400, 600, .8, 'sine', .07); tone(600, 800, .8, 'sine', .05, .15); },
  storm() { tone(90, 50, 1.2, 'sawtooth', .07); },
  wave() { tone(300, 180, .25, 'sine', .04); },
  level() { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, .25, 'triangle', .08, i * .1)); },
};

// ============================================================ palettes
const FISH_PAL = [[[255,130,40],[255,255,255]],[[30,110,200],[255,225,60]],[[255,215,60],[230,140,30]],[[255,95,190],[200,55,140]],[[50,205,205],[20,140,150]],[[120,225,110],[50,150,60]]];
const LOST_PAL = [[[255,200,60],[255,120,20]],[[120,255,210],[40,200,160]],[[255,170,255],[220,90,200]]];
const CORAL = [[255,105,180],[255,140,60],[170,80,200],[255,215,70],[240,90,80],[60,200,190],[140,230,110]];
const GRASS = [[70,190,110],[60,200,140],[90,170,90],[120,215,120]];

// ============================================================ scenery (pre-rendered)
function groundY(x) { return H - 92 + 14 * Math.sin(x * 0.007 + 0.5) + 8 * Math.sin(x * 0.019 + 2); }
function branch(g, x, y, ang, len, depth, color, tip, thick, rnd) {
  if (depth === 0 || len < 5) { g.fillStyle = tip; g.beginPath(); g.arc(x, y, Math.max(2, thick * 1.3), 0, TAU); g.fill(); return; }
  const x2 = x + Math.cos(ang) * len, y2 = y + Math.sin(ang) * len;
  g.strokeStyle = color; g.lineWidth = Math.max(2, thick); g.lineCap = 'round';
  g.beginPath(); g.moveTo(x, y); g.lineTo(x2, y2); g.stroke();
  const n = rnd() < 0.5 ? 2 : 3;
  for (let i = 0; i < n; i++) branch(g, x2, y2, ang + (rnd() * 1.7 - 0.85), len * (0.68 + rnd() * 0.14), depth - 1, color, tip, thick * 0.72, rnd);
}
function fan(g, x, y, r, c, tip) {
  g.fillStyle = rgb(shade(c, .55)); g.beginPath(); g.moveTo(x, y); g.arc(x, y, r, Math.PI * 1.03, Math.PI * 1.97); g.closePath(); g.fill();
  g.strokeStyle = rgb(c); g.lineWidth = 2;
  for (let i = 0; i < 15; i++) {
    const a = Math.PI * 1.03 + (Math.PI * 0.94) * i / 14;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); g.stroke();
    g.fillStyle = tip; g.beginPath(); g.arc(x + Math.cos(a) * r, y + Math.sin(a) * r, 3, 0, TAU); g.fill();
  }
}
function brain(g, x, y, r, c, tip) {
  g.fillStyle = rgb(c); g.beginPath(); g.ellipse(x, y, r, r * .7, 0, Math.PI, TAU); g.fill();
  g.strokeStyle = rgb(shade(c, .7)); g.lineWidth = 2;
  for (let i = 0; i < 6; i++) { const k = .2 + .14 * i; g.beginPath(); g.ellipse(x, y, r * k, r * .7 * k, 0, Math.PI, TAU); g.stroke(); }
  g.fillStyle = tip; g.globalAlpha = .6; g.beginPath(); g.ellipse(x - r * .25, y - r * .2, r * .25, r * .12, -.35, 0, TAU); g.fill(); g.globalAlpha = 1;
}
function tubes(g, x, y, c, tip, rnd) {
  const n = 4 + ((rnd() * 3) | 0);
  for (let i = 0; i < n; i++) {
    const w = 14 + rnd() * 8, h = 50 + rnd() * 60, tx = x + i * (w + 4) - 40;
    g.fillStyle = rgb(c); rr(g, tx, y - h, w, h + 10, w / 2); g.fill();
    g.fillStyle = rgb(shade(c, .4)); g.beginPath(); g.ellipse(tx + w / 2, y - h + w / 3, w / 2, w / 3, 0, 0, TAU); g.fill();
    g.strokeStyle = tip; g.lineWidth = 2; g.stroke();
  }
}
function buildScenery() {
  const rnd = mulberry(11);
  const bg = mk(W, H), g = bg.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, 'rgb(70,185,215)'); grad.addColorStop(.35, 'rgb(25,105,170)');
  grad.addColorStop(.75, 'rgb(10,45,95)'); grad.addColorStop(1, 'rgb(5,20,50)');
  g.fillStyle = grad; g.fillRect(0, 0, W, H);
  const far = [24, 72, 125];
  for (let i = 0; i < 10; i++) {
    const x = i * W / 9 + rnd() * 80 - 40, y = groundY(x) + 5, k = rnd();
    if (k < .5) branch(g, x, y, -Math.PI / 2, 40 + rnd() * 20, 4, rgb(far), rgb(shade(far, 1.2)), 7, rnd);
    else if (k < .8) fan(g, x, y, 60 + rnd() * 30, far, rgb(shade(far, 1.15)));
    else brain(g, x, y, 50 + rnd() * 30, far, rgb(shade(far, 1.2)));
  }
  // sand
  g.beginPath(); g.moveTo(0, H);
  for (let x = 0; x <= W + 20; x += 20) g.lineTo(x, groundY(x));
  g.lineTo(W + 20, H); g.closePath();
  const sg = g.createLinearGradient(0, H - 130, 0, H); sg.addColorStop(0, 'rgb(150,128,88)'); sg.addColorStop(1, 'rgb(70,70,70)');
  g.fillStyle = sg; g.fill();
  g.strokeStyle = 'rgba(200,175,130,.8)'; g.lineWidth = 3; g.beginPath();
  for (let x = 0; x <= W + 20; x += 20) x ? g.lineTo(x, groundY(x)) : g.moveTo(x, groundY(x)); g.stroke();
  g.strokeStyle = 'rgba(170,150,110,.5)'; g.lineWidth = 1;
  for (let i = 0; i < 26; i++) { const x = rnd() * W, y = groundY(x) + 14 + rnd() * 56; g.beginPath(); g.ellipse(x, y, 20 + rnd() * 40, 3, 0, Math.PI, TAU); g.stroke(); }
  // mid corals
  let x = 30;
  while (x < W) {
    const y = groundY(x) + 8, c = mixc(CORAL[(rnd() * CORAL.length) | 0], [20, 60, 110], .3), tip = rgb(shade(c, 1.35)), k = rnd();
    if (k < .45) branch(g, x, y, -Math.PI / 2, 34 + rnd() * 18, 5, rgb(c), tip, 7, rnd);
    else if (k < .65) fan(g, x, y, 55 + rnd() * 30, c, tip);
    else if (k < .85) brain(g, x, y, 40 + rnd() * 25, c, tip);
    else tubes(g, x, y, c, tip, rnd);
    x += 110 + rnd() * 80;
  }
  // foreground corals
  const fgH = 330, fg = mk(W, fgH), f = fg.getContext('2d');
  f.translate(0, -(H - fgH));
  for (let i = 0; i < 8; i++) {
    let fx = (i + .5) * W / 8 + rnd() * 120 - 60;
    if (rnd() < .4) fx = rnd() < .5 ? rnd() * 140 : W - rnd() * 140;
    const c = CORAL[(rnd() * CORAL.length) | 0], tip = rgb(shade(c, 1.3)), k = rnd();
    if (k < .5) branch(f, fx, H + 8, -Math.PI / 2, 48 + rnd() * 22, 5, rgb(c), tip, 11, rnd);
    else if (k < .75) fan(f, fx, H + 8, 90 + rnd() * 40, c, tip);
    else brain(f, fx, H - 4, 70 + rnd() * 30, c, tip);
  }
  f.fillStyle = 'rgb(70,80,95)';
  for (let i = 0; i < 9; i++) { f.beginPath(); f.ellipse(rnd() * W, H + 5, 40 + rnd() * 40, 16 + rnd() * 14, 0, Math.PI, TAU); f.fill(); }
  // vignette
  const vg = mk(W, H), v = vg.getContext('2d');
  const vr = v.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, W * .72);
  vr.addColorStop(0, 'rgba(0,10,25,0)'); vr.addColorStop(1, 'rgba(0,10,25,.62)');
  v.fillStyle = vr; v.fillRect(0, 0, W, H);
  const rv = mk(W, H), r2 = rv.getContext('2d');
  const rg = r2.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, W * .7);
  rg.addColorStop(0, 'rgba(255,40,40,0)'); rg.addColorStop(1, 'rgba(255,40,40,.85)');
  r2.fillStyle = rg; r2.fillRect(0, 0, W, H);
  return { bg, fg, fgY: H - fgH, vg, rv };
}
const SC = buildScenery();

// ============================================================ hand input
const hands = [newHand(), newHand()];
function newHand() { return { active: false, missing: 0, x: 0, y: 0, vx: 0, vy: 0, px: 0, py: 0, open: false, pinch: false, prev: false, grabbed: null, waveCd: 0, grabCd: 0, hover: null, pts: null, raw: [.5, .5] }; }
const remap = v => clamp((v - .5) / .8 + .5, 0, 1);
function extract(lm, ar) {
  const P = i => ({ x: (1 - lm[i].x) * ar, y: lm[i].y });
  const d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const w = P(0), ids = [0, 5, 9, 13, 17];
  let cx = 0, cy = 0; ids.forEach(i => { cx += 1 - lm[i].x; cy += lm[i].y; }); cx /= 5; cy /= 5;
  const size = d(w, P(9)) + 1e-6;
  let ext = 0;
  [[8, 6], [12, 10], [16, 14], [20, 18]].forEach(([t, p]) => { if (d(P(t), w) > d(P(p), w) * 1.12) ext++; });
  const ratio = d(P(4), P(8)) / size;
  const ppx = 1 - (lm[4].x + lm[8].x) / 2, ppy = (lm[4].y + lm[8].y) / 2;
  return { c: [remap(cx), remap(cy)], pp: [remap(ppx), remap(ppy)], ratio, open: ext >= 4 && ratio > .5, pts: lm.map(p => [1 - p.x, p.y]) };
}
function updateHand(h, s, dt) {
  h.prev = h.pinch; h.waveCd -= dt; h.grabCd -= dt;
  if (!s) {
    h.missing += dt;
    if (h.missing > .3) { h.active = false; h.pinch = false; h.open = false; h.vx = h.vy = 0; h.pts = null; }
    return;
  }
  h.missing = 0;
  const tx = s.c[0] * W, ty = s.c[1] * H, px = s.pp[0] * W, py = s.pp[1] * H;
  h.raw = s.c;
  if (!h.active) { h.active = true; h.x = tx; h.y = ty; h.px = px; h.py = py; h.vx = h.vy = 0; h.pinch = false; }
  const a = 1 - Math.exp(-dt * 24), nx = h.x + (tx - h.x) * a, ny = h.y + (ty - h.y) * a, b = 1 - Math.exp(-dt * 10);
  h.vx += ((nx - h.x) / Math.max(dt, 1e-3) - h.vx) * b; h.vy += ((ny - h.y) / Math.max(dt, 1e-3) - h.vy) * b;
  const sp = Math.hypot(h.vx, h.vy); if (sp > 1800) { h.vx *= 1800 / sp; h.vy *= 1800 / sp; }
  h.x = nx; h.y = ny; h.px += (px - h.px) * a; h.py += (py - h.py) * a;
  if (h.pinch) { if (s.ratio > .55) h.pinch = false; } else if (s.ratio < .33) h.pinch = true;
  h.open = !!s.open && !h.pinch; h.pts = s.pts;
}
const hspeed = h => Math.hypot(h.vx, h.vy);

// camera + MediaPipe
let landmarker = null, camReady = false, lastVT = -1, mouseMode = true, camSamples = [];
async function startCamera() {
  statusEl.textContent = 'Requesting camera...';
  const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'user' }, audio: false });
  video.srcObject = stream; await video.play();
  statusEl.textContent = 'Loading hand-tracking model (first time takes a few seconds)...';
  const base = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
  const mod = await import(base + '/vision_bundle.mjs');
  const fileset = await mod.FilesetResolver.forVisionTasks(base + '/wasm');
  const modelUrl = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
  const opts = d => ({ baseOptions: { modelAssetPath: modelUrl, delegate: d }, runningMode: 'VIDEO', numHands: 2, minHandDetectionConfidence: .6, minHandPresenceConfidence: .5, minTrackingConfidence: .5 });
  try { landmarker = await mod.HandLandmarker.createFromOptions(fileset, opts('GPU')); }
  catch (e) { landmarker = await mod.HandLandmarker.createFromOptions(fileset, opts('CPU')); }
  camReady = true;
}
function detectHands() {
  if (!landmarker || video.readyState < 2 || video.currentTime === lastVT) return;
  lastVT = video.currentTime;
  try {
    const res = landmarker.detectForVideo(video, performance.now());
    const ar = (video.videoWidth || 640) / (video.videoHeight || 480);
    camSamples = (res.landmarks || []).map(lm => extract(lm, ar));
  } catch (e) { /* ignore a bad frame */ }
}

// mouse / touch
const ptr = { x: W / 2, y: H / 2, seen: false, left: false, right: false };
const keys = {}, ui = { wave: false, whirl: false, calm: false };
function ptrPos(e) { const r = canvas.getBoundingClientRect(); ptr.x = (e.clientX - r.left) / r.width * W; ptr.y = (e.clientY - r.top) / r.height * H; ptr.seen = true; }
canvas.addEventListener('pointermove', e => { ptrPos(e); });
canvas.addEventListener('pointerdown', e => { ptrPos(e); if (e.button === 2) ptr.right = true; else ptr.left = true; if (!actx) initAudio(); canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointerup', e => { if (e.button === 2) ptr.right = false; else ptr.left = false; if (e.pointerType === 'touch') ptr.seen = false; });
canvas.addEventListener('pointerleave', () => { if (!ptr.left) ptr.seen = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
[['uiWave', 'wave'], ['uiWhirl', 'whirl'], ['uiCalm', 'calm']].forEach(([id, k]) => {
  const b = document.getElementById(id);
  b.addEventListener('pointerdown', e => { ui[k] = true; b.classList.add('on'); e.stopPropagation(); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, () => { ui[k] = false; b.classList.remove('on'); }));
});
function mouseSamples() {
  if (!ptr.seen) return [];
  const c = [ptr.x / W, ptr.y / H];
  return [{ c, pp: c, ratio: ptr.left ? .15 : .9, open: ptr.right || ui.wave, pts: null }];
}
function initAudio() { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } }

// ============================================================ world state
const G = {
  t: 0, state: 'menu', stateT: 0,
  waves: [], particles: [], popups: [], banner: null,
  whirlA: 0, wx: W / 2, wy: H / 2, whirlR: 220, pairMode: null, curMode: null,
  calmProg: 0, calmCd: 0, calmTimer: 0,
  storm: 'none', stormT: 0, stormNext: 1e9, stormInt: 0, lightning: 0, flash: 0, shake: 0,
  score: 0, lives: 3, level: 1, delivered: 0, goal: 5, combo: 0, lastDeliver: -99,

  for (let i = 0; i < 5; i++) heart(rx + 34 + i * 44, 62, 30, i < G.lives ? '#ff5a6a' : 'rgba(80,60,70,.8)', i < G.lives ? '#fff' : '#765');
  if (G.combo > 1 && G.t - G.lastDeliver < 8) txt('COMBO x' + Math.min(G.combo, 5), rx + 242, 38, 15, '#7ff', 'right');
  panel(rx, 100, 260, 36, 'rgba(8,40,70,.55)');
  txt('CALM', rx + 14, 123, 14, '#c8ebff');
  const cbx = rx + 70, cbw = 176; ctx.fillStyle = 'rgba(40,60,90,.8)'; rr(ctx, cbx, 111, cbw, 12, 6); ctx.fill();
  let cf, cc; if (G.calmCd > 0 && G.storm !== 'storm') { cf = 1 - G.calmCd / 14; cc = '#8a8aa0'; } else if (G.calmProg > 0) { cf = G.calmProg; cc = '#ffeb82'; } else { cf = 1; cc = '#96f096'; }
  ctx.fillStyle = cc; rr(ctx, cbx, 111, Math.max(12, cbw * clamp(cf, 0, 1)), 12, 6); ctx.fill();
  if (G.storm !== 'none') {
    panel(W / 2 - 250, 84, 500, 52, 'rgba(30,20,60,.75)', '#7a7aff');
    txt(G.storm === 'storm' ? 'STORM!  bring both hands together' : 'STORM INCOMING...', W / 2, 108, 22, '#dcdcff', 'center');
    if (G.storm === 'storm') { ctx.fillStyle = 'rgba(60,40,40,.9)'; rr(ctx, W / 2 - 220, 118, 440, 8, 4); ctx.fill(); ctx.fillStyle = '#7a7aff'; rr(ctx, W / 2 - 220, 118, Math.max(8, 440 * clamp(G.stormT / 12, 0, 1)), 8, 4); ctx.fill(); }
  }
}
function drawCursors(t) {
  for (const h of hands) {
    if (!h.active) continue;
    ctx.save(); ctx.lineWidth = 3;
    if (h.pinch) { ctx.strokeStyle = '#ffd73c'; ctx.beginPath(); ctx.arc(h.px, h.py, 16, 0, TAU); ctx.stroke(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(h.px, h.py, 4, 0, TAU); ctx.fill(); }
    else if (h.open) { const r = 34 + 4 * Math.sin(t * 8); ctx.strokeStyle = '#78e6ff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(h.x, h.y, r, 0, TAU); ctx.stroke(); ctx.fillStyle = '#78e6ff'; for (let i = 0; i < 5; i++) { const a = t * 2 + i * 1.2566; ctx.beginPath(); ctx.arc(h.x + Math.cos(a) * r, h.y + Math.sin(a) * r, 3, 0, TAU); ctx.fill(); } }
    else { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(h.x, h.y, 20, 0, TAU); ctx.stroke(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(h.x, h.y, 3, 0, TAU); ctx.fill(); }
    ctx.restore();
    if (h.hover && !h.grabbed) {
      const f = h.hover, r = f.size * 1.7; ctx.save(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      for (let i = 0; i < 8; i++) { const a0 = t * 1.6 + i * Math.PI / 4; ctx.beginPath(); ctx.arc(f.x, f.y, r, a0, a0 + .35); ctx.stroke(); } ctx.restore();
      if (!h.pinch) txt('pinch!', f.x, f.y - r - 8, 14, '#fff', 'center');
    }
    if (h.grabbed) { ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(h.px, h.py); ctx.lineTo(h.grabbed.x, h.grabbed.y); ctx.stroke(); ctx.restore(); }
  }
  if (G.calmProg > .02) {
    const act = hands.filter(h => h.active); if (act.length) {
      const cx = act.reduce((a, h) => a + h.x, 0) / act.length, cy = act.reduce((a, h) => a + h.y, 0) / act.length;
      ctx.save(); ctx.strokeStyle = '#fff0aa'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(cx, cy, 60, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(G.calmProg, 0, 1)); ctx.stroke(); ctx.restore();
      txt('CALMING...', cx, cy + 92, 18, '#fff5c8', 'center');
    }
  }
}
function drawLegend() {
  const items = [['move', 'MOVE', 'currents', hands.some(h => h.active && hspeed(h) > 250)], ['wave', 'OPEN PALM', 'waves', hands.some(h => h.active && h.open)],
    ['pinch', 'PINCH', 'grab fish', hands.some(h => h.active && h.pinch)], ['whirl', 'HANDS APART', 'whirlpool', G.curMode === 'whirl'], ['calm', 'HANDS TOGETHER', 'calm', G.curMode === 'calm']];
  ctx.save(); ctx.font = '700 13px "Trebuchet MS",sans-serif';
  const ws = items.map(i => 48 + Math.max(ctx.measureText(i[1]).width, ctx.measureText(i[2]).width) + 18), gap = 10, total = ws.reduce((a, b) => a + b, 0) + gap * 4;
  ctx.restore();
  let x = (W - total) / 2; const y = H - 60;
  items.forEach((it, i) => {
    const on = it[3]; panel(x, y, ws[i], 48, on ? 'rgba(20,110,170,.85)' : 'rgba(8,36,64,.6)', on ? '#fff0a0' : 'rgba(150,190,220,.5)', 14);
    const col = on ? '#ffffd0' : '#bfdcf0'; icon(it[0], x + 24, y + 24, 13, col);
    txt(it[1], x + 46, y + 22, 13, col); txt(it[2], x + 46, y + 38, 12, on ? '#fff' : '#9ec4de', 'left', 1, '400'); x += ws[i] + gap;
  });
}
function drawPip() {
  const pw = 224, ph = 168, x = 16, y = H - 70 - ph - 8;
  ctx.save(); rr(ctx, x, y, pw, ph, 10); ctx.clip();
  if (!mouseMode && video.readyState >= 2) {
    ctx.translate(x + pw, y); ctx.scale(-1, 1); ctx.globalAlpha = .88; ctx.drawImage(video, 0, 0, pw, ph); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(255,230,120,.9)'; ctx.lineWidth = 1;
    const CONN = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
    for (const h of hands) if (h.active && h.pts) {
      ctx.beginPath(); CONN.forEach(([a, b]) => { ctx.moveTo(x + h.pts[a][0] * pw, y + h.pts[a][1] * ph); ctx.lineTo(x + h.pts[b][0] * pw, y + h.pts[b][1] * ph); }); ctx.stroke();
      ctx.fillStyle = h.pinch ? '#3cff78' : '#50c8ff'; h.pts.forEach(p => { ctx.beginPath(); ctx.arc(x + p[0] * pw, y + p[1] * ph, 2, 0, TAU); ctx.fill(); });
    }
  } else {
    ctx.fillStyle = 'rgba(8,30,50,.85)'; ctx.fillRect(x, y, pw, ph);
    if (mouseMode) ['MOUSE / TOUCH MODE', 'left button = pinch', 'right button = open palm', 'hold W = whirlpool', 'hold C = calm'].forEach((s, i) => txt(s, x + 14, y + 30 + i * 26, 14, i ? '#fff0c8' : '#78ffff'));
  }
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,230,160,.9)'; ctx.lineWidth = 2; rr(ctx, x, y, pw, ph, 10); ctx.stroke();
  const n = hands.filter(h => h.active).length;
  txt(mouseMode ? 'CONTROLS' : 'CAMERA  ' + n + ' hand' + (n === 1 ? '' : 's'), x + 8, y - 6, 13, '#e6f0ff');
}
function drawMenu(t) {
  ctx.fillStyle = 'rgba(0,15,30,.45)'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.textAlign = 'center'; ctx.font = '800 80px "Trebuchet MS",sans-serif';
  ctx.shadowColor = '#4fd8ff'; ctx.shadowBlur = 40; ctx.fillStyle = '#fff'; ctx.fillText('CONTROL THE OCEAN', W / 2, 150); ctx.shadowBlur = 0; ctx.restore();
  txt('a gesture-powered underwater adventure', W / 2, 192, 22, '#ffebb4', 'center');
  const cards = [['move', 'MOVE YOUR HAND', 'Sweep the water to\ncreate ocean currents'], ['wave', 'OPEN PALM', 'Hold up a flat hand\nto send out waves'], ['pinch', 'PINCH', 'Thumb + index finger\ngrabs a fish. Let go\nto fling it'], ['whirl', 'TWO HANDS APART', 'Summon a whirlpool\nthat dizzies sharks'], ['calm', 'HANDS TOGETHER', 'Palms touching calms\nstorms and sharks']];
  const cw = 220, ch = 190, gap = 16, x0 = (W - (cw * 5 + gap * 4)) / 2, y0 = 240;
  cards.forEach((c, i) => {
    const x = x0 + i * (cw + gap); panel(x, y0, cw, ch, 'rgba(10,50,90,.7)', 'rgba(255,230,170,.8)', 18);
    icon(c[0], x + cw / 2, y0 + 52, 30, '#fff0aa'); txt(c[1], x + cw / 2, y0 + 108, 17, '#fff', 'center');
    c[2].split('\n').forEach((ln, j) => txt(ln, x + cw / 2, y0 + 134 + j * 21, 14, '#d2e1f5', 'center', 1, '400'));
  });
  const gy = y0 + ch + 40;
  txt('GOAL: guide the glowing LOST FISH into the SAFE REEF before their energy runs out.', W / 2, gy, 19, '#fff0be', 'center');
  txt('Avoid sharks  -  survive storms  -  don\'t touch jellyfish  -  collect pearls', W / 2, gy + 28, 17, '#c8e1ff', 'center');
  const pulse = .55 + .45 * Math.sin(t * 3.5);
  panel(W / 2 - 240, gy + 50, 480, 56, `rgba(30,140,200,${.55 + .3 * pulse})`, '#fff0aa', 28);
  txt(mouseMode ? 'CLICK to dive in   (or SPACE)' : 'PINCH to dive in   (or SPACE)', W / 2, gy + 87, 25, '#fff', 'center');
  if (!mouseMode && !hands.some(h => h.active)) txt('Show your hand to the camera - play with the fish while you wait!', W / 2, gy + 135, 17, '#ffdca0', 'center');
}
function drawGameOver() {
  ctx.fillStyle = 'rgba(0,10,20,.5)'; ctx.fillRect(0, 0, W, H);
  panel(W / 2 - 280, H / 2 - 190, 560, 360, 'rgba(50,15,25,.82)', '#ff8c8c', 26);
  txt('GAME OVER', W / 2, H / 2 - 105, 60, '#ff8282', 'center');
  txt('SCORE  ' + G.score, W / 2, H / 2 - 35, 40, '#fff', 'center');
  txt('Level reached: ' + G.level + '     Fish rescued: ' + G.delivered, W / 2, H / 2 + 8, 20, '#dce6ff', 'center', 1, '400');
  txt('BEST  ' + G.hi, W / 2, H / 2 + 50, 28, '#ffe696', 'center');
  if (G.newBest) txt('NEW HIGH SCORE!', W / 2, H / 2 + 86, 24, '#78ffff', 'center');
  if (G.stateT > 1.5) txt(mouseMode ? 'CLICK or press SPACE to play again' : 'PINCH or press SPACE to play again', W / 2, H / 2 + 140, 22, '#fff', 'center', .6 + .4 * Math.sin(G.t * 4));
}
function render() {
  const t = G.t;
  ctx.save();
  if (G.shake > .02) { const a = G.shake * 14; ctx.translate(rand(-a, a), rand(-a, a)); }
  drawWorld(t);
  if (G.stormInt > .02) {
    ctx.fillStyle = `rgba(25,30,45,${.5 * G.stormInt})`; ctx.fillRect(0, 0, W, H);
    if (G.storm === 'storm') { ctx.strokeStyle = 'rgba(200,225,240,.5)'; ctx.lineWidth = 1; ctx.beginPath(); for (let i = 0; i < 90; i++) { const x = rand(0, W), y = rand(0, H); ctx.moveTo(x, y); ctx.lineTo(x - 6, y + 22); } ctx.stroke(); }
  }
  if (G.lightning > .01) { ctx.fillStyle = `rgba(255,255,255,${.4 * G.lightning})`; ctx.fillRect(0, 0, W, H); }
  if (G.calmTimer > 0) { ctx.fillStyle = `rgba(120,230,255,${.1 * Math.min(1, G.calmTimer / 1.2)})`; ctx.fillRect(0, 0, W, H); }
  if (G.flash > .01) { ctx.globalAlpha = Math.min(1, G.flash * 1.2); ctx.drawImage(SC.rv, 0, 0); ctx.globalAlpha = 1; }
  ctx.restore();

  if (G.state !== 'menu') drawHUD();
  if (G.state === 'menu') drawMenu(t); else if (G.state === 'gameover') drawGameOver();
  else if (G.state === 'paused') { panel(W / 2 - 200, H / 2 - 60, 400, 120, 'rgba(10,40,70,.8)'); txt('PAUSED', W / 2, H / 2 + 12, 48, '#fff0c8', 'center'); txt('press P to resume', W / 2, H / 2 + 45, 17, '#ddd', 'center', 1, '400'); }
  drawCursors(t); drawLegend(); drawPip();
  for (const p of G.popups) txt(p.s, p.x, p.y, p.size, p.color, 'center', clamp(p.t / .6, 0, 1));
  if (G.banner && G.state !== 'menu') {
    const b = G.banner, a = clamp(Math.min(b.t, b.dur - b.t) / .35, 0, 1);
    if (a > .02) { ctx.save(); ctx.globalAlpha = .6 * a; panel(W / 2 - 330, H * .3 - 62, 660, b.sub ? 130 : 96, 'rgba(10,25,50,.9)', null, 22); ctx.restore(); txt(b.big, W / 2, H * .3 + 12, 52, b.color, 'center', a); if (b.sub) txt(b.sub, W / 2, H * .3 + 52, 24, '#f0f0f0', 'center', a, '400'); }
  }
  txt(muted ? 'M: sound off' : 'M: mute', W - 14, H - 12, 12, 'rgba(255,255,255,.6)', 'right', 1, '400');
}

// ============================================================ main loop + keys
addEventListener('keydown', e => {
  const k = e.key.toLowerCase(); keys[k] = true;
  if (k === ' ') { e.preventDefault(); if (G.state === 'menu' || G.state === 'gameover') startGame(); }
  else if (k === 'r') startGame();
  else if (k === 'p') { if (G.state === 'paused') G.state = G.prevState; else if (G.state === 'playing') { G.prevState = 'playing'; G.state = 'paused'; } }
  else if (k === 'm') muted = !muted;
  else if (k === 'f') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); }
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

let last = performance.now(), running = false;
function loop(now) {
  const dt = Math.min((now - last) / 1000, .05); last = now;
  update(Math.max(dt, 1e-3)); render();
  requestAnimationFrame(loop);
}
function begin(useMouse) {
  mouseMode = useMouse; intro.style.display = 'none';
  document.getElementById('touchbtns').style.display = useMouse ? 'flex' : 'none';
  initAudio();
  if (!running) { running = true; last = performance.now(); requestAnimationFrame(loop); }
}
document.getElementById('btnMouse').onclick = () => begin(true);
document.getElementById('btnCam').onclick = async () => {
  const b = document.getElementById('btnCam'); b.disabled = true;
  try { await startCamera(); begin(false); }
  catch (e) {
    console.error(e); b.disabled = false;
    statusEl.textContent = (e && e.name === 'NotAllowedError') ? 'Camera permission was denied. Allow it in the address bar, or play with mouse/touch.' : 'Could not start camera tracking (' + (e && e.message || e) + '). You can still play with mouse/touch.';
  }
};
// show the ocean behind the intro
running = true; mouseMode = true; requestAnimationFrame(loop);
window.__ocean = { G, update, render, hands, ptr, keys, setMouse: v => { mouseMode = v; } };
})();
</script>
